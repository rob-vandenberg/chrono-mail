# --- Version ------------------------------------------------------------
# nfpm.yaml 2.3.318
# --- Version history ----------------------------------------------------
# v2.3.318: The app information (chrono-mail.metainfo.xml), so that software centres list Chrono Mail as installed, with Uninstall
# v0.5.127: Initial: the .deb and .rpm of Chrono Mail, made by packaging/package_linux.sh
#
# The program folder (build/linux/chrono-mail.dist, made by packaging/build_linux.sh) carries its own Python and Qt; the
# packages only ask for the system libraries a desktop may not have yet. Run from the project root.
name: chrono-mail
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: mail
priority: optional
maintainer: Rob Vandenberg <robvandenberg64@gmail.com>
description: |
  Chrono Mail: an open-source desktop e-mail client.
  POP3, IMAP and SMTP mail with an encrypted local store, calendars, tasks and contacts with CalDAV and CardDAV.
vendor: Chrono Mail
homepage: https://github.com/rob-vandenberg/chrono-mail
license: AGPL-3.0-or-later

contents:
  - src: build/linux/chrono-mail.dist
    dst: /opt/chrono-mail
    type: tree
  - src: /opt/chrono-mail/chrono-mail
    dst: /usr/bin/chrono-mail
    type: symlink
  - src: packaging/chrono-mail.desktop
    dst: /usr/share/applications/chrono-mail.desktop
  - src: packaging/chrono-mail.metainfo.xml
    dst: /usr/share/metainfo/io.github.rob_vandenberg.chrono_mail.metainfo.xml
  - src: src/chrono_mail/ui/resources/chrono-mail.svg
    dst: /usr/share/icons/hicolor/scalable/apps/chrono-mail.svg
  - src: LICENSE
    dst: /usr/share/doc/chrono-mail/LICENSE

overrides:
  deb:
    depends:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - libgl1
      - libfontconfig1
      - libdbus-1-3
      - libnss3
      - libasound2 | libasound2t64
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxtst6
      - libgbm1
      - libdrm2
      - libxkbfile1
      - libwayland-cursor0
      - libwayland-egl1
      - libcups2 | libcups2t64
      - libglib2.0-0 | libglib2.0-0t64
      - libxfixes3
  rpm:
    depends:
      - libxcb-cursor.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libdbus-1.so.3()(64bit)
      - libnss3.so()(64bit)
      - libasound.so.2()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
      - libXrandr.so.2()(64bit)
      - libXtst.so.6()(64bit)
      - libgbm.so.1()(64bit)
      - libdrm.so.2()(64bit)
      - libxkbfile.so.1()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libcups.so.2()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libXfixes.so.3()(64bit)

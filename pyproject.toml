[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-mail"
version = "2.0.287"
description = "An open-source desktop email client for Linux, with the functions of a full mail program."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=50",
    "icalendar>=7",
    "keyring>=25.7",
    "platformdirs>=4.3",
    "publicsuffixlist>=1.1",
    "PySide6>=6.12",
    "python-dateutil>=2.9",
    "recurring-ical-events>=3.8",
    "tzdata>=2026.1",
    "tzlocal>=5.3",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=1.3",
    "pytest>=9.1",
    "pytest-qt>=4.5",
    "types-python-dateutil>=2.9",
    "import-linter>=2.15",
]

[project.scripts]
chrono-mail-cli = "chrono_mail.cli:main"

[project.gui-scripts]
chrono-mail = "chrono_mail.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chrono_mail = ["py.typed", "ui/resources/*.svg", "ui/resources/*.ico", "ui/resources/icons/*.svg", "ui/resources/icons/*.txt"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
project-excludes = ["tests/data"]
search-path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not oskeyring and not perf'"
faulthandler_timeout = 20  # a test that waits longer prints where every thread waits (tests/conftest.py stops it)
markers = [
    "live: talks to a real mail server (opt-in: pytest -m live)",
    "oskeyring: uses the real operating system credential store (opt-in: pytest -m oskeyring)",
    "perf: generates and measures a 500,000-message mailbox (opt-in: pytest -m perf -s)",
]

[tool.importlinter]
root_package = "chrono_mail"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE.md section 3)"
type = "layers"
layers = [
    "chrono_mail.cli | chrono_mail.ui",
    "chrono_mail.engine",
    "chrono_mail.sync",
    "chrono_mail.pimstore",
    "chrono_mail.store | chrono_mail.index | chrono_mail.protocols",
    "chrono_mail.crypto | chrono_mail.mime | chrono_mail.config | chrono_mail.pim",
    "chrono_mail.core",
]

[[tool.importlinter.contracts]]
name = "Only ui may import PySide6"
type = "forbidden"
source_modules = [
    "chrono_mail.core",
    "chrono_mail.crypto",
    "chrono_mail.mime",
    "chrono_mail.config",
    "chrono_mail.store",
    "chrono_mail.index",
    "chrono_mail.protocols",
    "chrono_mail.pim",
    "chrono_mail.pimstore",
    "chrono_mail.sync",
    "chrono_mail.engine",
    "chrono_mail.cli",
]
forbidden_modules = ["PySide6", "shiboken6"]

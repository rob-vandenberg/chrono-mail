name: checks

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CHRONO_MAIL_FAST_EXIT: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Libraries Qt needs without a screen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1 libxkbfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Type check (Pyrefly, strict)
        run: pyrefly check
      - name: Layers
        run: lint-imports
      - name: Tests, offline (no mail server needed)
        run: pytest -q
